<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Sepia's Space</title>
    <link rel="shortcut icon" href="https://files.catbox.moe/kv4z75.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to Sepia's Space!</h1>
    <h2 id="goodmessage">JavaScript Is Disabled.</h2>
    <img src="https://files.catbox.moe/e1k8s5.gif">
    <br>

    <br>
    <p id="mapsroute"><a href="map.html" target="_self">Map of the Site.</a></p>
    <script>
        var now = new Date();
        var hour = now.getHours();
        var darp = document.getElementById('goodmessage');

        if (hour < 12) {
            darp.innerText = "Good Morning!";
        } else if (hour < 18) {
            darp.innerText = "Good Afternoon!";
        } else {
            darp.innerText = "Good Night!";
        }
    </script>
</body>
