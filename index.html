<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepia's Space</title>
    <link rel="shortcut icon" href="https://files.catbox.moe/kv4z75.jpg" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome to Sepia's Space!</h1>
    <hr>
    <h2 id="goodmsg">JavaScript Is Disabled.</h2>
    <img src="https://files.catbox.moe/e1k8s5.gif" style="height: 50px;">
    <br>
    <img src="https://files.catbox.moe/yqaoqt.jpg" style="width: 557px;" alt="Cute Mococo Gif">
    <br>
    <audio src="https://files.catbox.moe/ij8rc4.mp3" controls preload="auto"></audio>
    <p id="mapsroute"><a href="map.html" target="_self">Map.</a></p>
    <script>
        const now = new Date();
        const hour = now.getHours();
        const darp = document.getElementById('goodmsg');

        if (hour < 12) {
            darp.innerText = "Good Morning!";
        } else if (hour < 18) {
            darp.innerText = "Good Afternoon!";
        } else {
            darp.innerText = "Good Night!";
        }
    </script>
</body>
</html>
